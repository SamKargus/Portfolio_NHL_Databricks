bundle:
  name: nhl-pipeline

variables:
  delta_base:
    description: DBFS root for all Delta tables and landing files
    default: dbfs:/nhl
  landing_base:
    description: Local /dbfs path used by the producer to write NDJSON files
    default: /dbfs/nhl/landing
  databricks_catalog:
    description: Unity Catalog catalog name (hive_metastore for legacy)
    default: hive_metastore
  databricks_schema:
    description: Schema / database name inside the catalog
    default: nhl

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production


resources:
  jobs:

    # ── 1. NHL API Producer (continuous) ────────────────────────────────────────
    nhl_producer:
      name: NHL API Producer
      description: Polls NHL live API every 5 s and writes NDJSON landing files to DBFS
      tasks:
        - task_key: producer
          spark_python_task:
            python_file: src/ingestion/nhl_api_producer.py
          job_cluster_key: producer_cluster
          libraries:
            - pypi:
                package: requests>=2.31.0
            - pypi:
                package: pyyaml>=6.0.1
            - pypi:
                package: python-dotenv>=1.0.0
      job_clusters:
        - job_cluster_key: producer_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: m5.large
            num_workers: 0
            spark_env_vars:
              LANDING_BASE: ${var.landing_base}
              DELTA_BASE: ${var.delta_base}
      continuous:
        pause_status: UNPAUSED
      max_concurrent_runs: 1

    # ── 2. Streaming pipeline (continuous) ──────────────────────────────────────
    nhl_streaming_pipeline:
      name: NHL Streaming Pipeline
      description: Auto Loader bronze → silver → gold Delta pipeline
      tasks:
        - task_key: bronze
          spark_python_task:
            python_file: src/streaming/bronze_streaming.py
          job_cluster_key: streaming_cluster

        - task_key: silver
          spark_python_task:
            python_file: src/streaming/silver_streaming.py
          depends_on:
            - task_key: bronze
          job_cluster_key: streaming_cluster

        - task_key: gold
          spark_python_task:
            python_file: src/streaming/gold_streaming.py
          depends_on:
            - task_key: silver
          job_cluster_key: streaming_cluster

      job_clusters:
        - job_cluster_key: streaming_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
            spark_env_vars:
              DELTA_BASE: ${var.delta_base}
              DATABRICKS_CATALOG: ${var.databricks_catalog}
              DATABRICKS_SCHEMA: ${var.databricks_schema}
            spark_conf:
              spark.databricks.delta.autoCompact.enabled: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"

      continuous:
        pause_status: UNPAUSED
      max_concurrent_runs: 1

    # ── 3. Nightly batch job (cron 04:00 UTC) ───────────────────────────────────
    nhl_nightly_batch:
      name: NHL Nightly Batch
      description: Aggregates daily game data into historical Delta tables
      tasks:
        - task_key: nightly_batch
          spark_python_task:
            python_file: src/batch/nightly_batch_job.py
            parameters:
              - "--seasons"
              - "20242025"
          job_cluster_key: batch_cluster
          libraries:
            - pypi:
                package: requests>=2.31.0

      job_clusters:
        - job_cluster_key: batch_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: m5.xlarge
            num_workers: 4
            spark_env_vars:
              DELTA_BASE: ${var.delta_base}
              DATABRICKS_CATALOG: ${var.databricks_catalog}
              DATABRICKS_SCHEMA: ${var.databricks_schema}

      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      max_concurrent_runs: 1
