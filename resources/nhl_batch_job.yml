# Batch pipeline job: bronze backfill in parallel date chunks, then silver, then gold.
#
#   plan_bronze_chunks ──► bronze_chunks (for-each, N at a time) ──► silver ──► gold
#                            ├─ batch_bronze.py 1916-01-01 → 1936-05-06
#                            ├─ batch_bronze.py 1936-05-07 → 1955-03-14
#                            └─ ...                          → today
#
# The default run loads 1916 → today. Games already in bronze are skipped, so a
# re-run only fetches what's missing. To top up recent games instead (e.g. a
# nightly run), run it with start_date set to a recent day.
#
# Runs on serverless compute. To use a classic job cluster, replace each
# `environment_key` with a `job_cluster_key` and add a `job_clusters` block.

resources:
  jobs:
    nhl_batch:
      name: nhl_batch_pipeline
      max_concurrent_runs: 1   # two runs would fetch and append the same games

      parameters:
        - name: start_date
          default: "1916-01-01"
        - name: end_date
          default: ""          # empty = today
        - name: num_chunks
          default: "16"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      tasks:
        - task_key: plan_bronze_chunks
          environment_key: default
          spark_python_task:
            python_file: ../src/batch/plan_bronze_chunks.py
            parameters:
              - "--start_date={{job.parameters.start_date}}"
              - "--end_date={{job.parameters.end_date}}"
              - "--num_chunks={{job.parameters.num_chunks}}"

        - task_key: bronze_chunks
          depends_on:
            - task_key: plan_bronze_chunks
          for_each_task:
            inputs: "{{tasks.plan_bronze_chunks.values.chunks}}"
            concurrency: ${var.bronze_concurrency}
            task:
              task_key: bronze_chunk
              environment_key: default
              # A failed chunk is retried on its own; games it already stored
              # are skipped on the retry.
              max_retries: 2
              min_retry_interval_millis: 120000
              spark_python_task:
                python_file: ../src/batch/batch_bronze.py
                parameters:
                  - "--start_date={{input.start_date}}"
                  - "--end_date={{input.end_date}}"

        - task_key: silver
          depends_on:
            - task_key: bronze_chunks
          environment_key: default
          spark_python_task:
            python_file: ../src/batch/batch_silver.py

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          spark_python_task:
            python_file: ../src/batch/batch_gold.py
